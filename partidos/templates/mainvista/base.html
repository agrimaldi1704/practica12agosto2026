<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Restaurante Alfredo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --cafe-oscuro: #4E342E;
            --cafe-medio: #6F4518;
            --caramelo: #C68958;
            --crema: #FFF8F0;
        }
        body { background-color: var(--crema); }
        .navbar { background-color: var(--cafe-oscuro) !important; }
        .navbar-brand { color: var(--caramelo) !important; font-weight: bold; }
        .nav-link { color: #FFF !important; }
        .nav-link:hover { color: var(--caramelo) !important; }
        .btn-primary {
            background-color: var(--cafe-medio);
            border-color: var(--cafe-medio);
        }
        .btn-primary:hover {
            background-color: var(--caramelo);
            border-color: var(--caramelo);
        }
        .card { border-color: var(--caramelo); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'menu' %}">🍽️ Restaurante Alfredo</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'menu' %}">🍰 Menú Digital</a>
                <a class="nav-link" href="{% url 'cocina' %}">🧑‍🍳 Cocina (Comandas)</a>
                <a class="nav-link" href="/admin/" target="_blank">🔐 Panel Admin</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
